name: Funkcionalnost
description: Predloga za novo funkcionalnost po agilni metodologiji
type: Feature
body:
  - type: textarea
    id: description
    attributes:
      label: Opis funkcionalnosti
      description: "Jasen opis nove funkcionalnosti in njenega namena."
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioriteta
      description: "1P - najvišja, 4P - najnižja"
      options:
        - 4P
        - 3P
        - 2P
        - 1P
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Dodatne opombe
      description: "Skice, povezave, kontekst ali drugi relevantni viri"
